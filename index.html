<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cells</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.js"></script>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    #titleBox {
      position: absolute;
      top: 15px;
      left: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 12px;
      border-radius: 6px;
      color: black;
    }

    #titleBox h2 {
      margin: 0;
      font-size: 22px;
    }

    #titleBox p {
      margin: 4px 0 0 0;
      font-size: 15px;
    }

    canvas {
      display: block;
      margin: 80px auto 20px auto;
      border: 1px solid #999;
    }
  </style>
</head>
<body>

  <div id="titleBox">
    <h2>3D Cells Project</h2>
    <p>Made by Aurangzeb</p>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
